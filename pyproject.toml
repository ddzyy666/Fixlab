[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixlab"
version = "0.1.0"
description = "A recoverable and evaluable code repair agent harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fixlab = "fixlab.cli:main"

[tool.setuptools.packages.find]
include = ["fixlab*"]
